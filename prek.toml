default_install_hook_types = ["pre-commit", "pre-push"]
# The reference specifications are redistributed verbatim under licences that
# require it (CC BY-ND forbids distributing modified copies), so the
# whitespace and end-of-file fixers must not touch them.
exclude = "^(src/core_pdf/api/compat/_unsupported/|tests/fixtures/specifications/)"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-merge-conflict" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  { id = "ruff-check", args = [
    "--fix",
  ], types_or = [
    "python",
    "pyi",
  ] },
  { id = "ruff-format", types_or = [
    "python",
    "pyi",
  ] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "mypy", name = "mypy", entry = "uv run --all-packages --group lint mypy --exclude ^src/core_pdf/api/compat/_unsupported/", language = "system", pass_filenames = false, files = "^(src/core_pdf/|packages/core-pdf-(ocr|spec|validate)/src/core_pdf_(ocr|spec|validate)/).*\\.py$", stages = [
    "pre-push",
    "manual",
  ], require_serial = true },
  { id = "import-linter", name = "import-linter", entry = "uv run --all-packages --group lint lint-imports", language = "system", pass_filenames = false, files = "^((src/core_pdf/|packages/core-pdf-(ocr|spec|validate)/src/core_pdf_(ocr|spec|validate)/).*\\.py|pyproject\\.toml|packages/core-pdf-(ocr|spec|validate)/pyproject\\.toml)$", stages = [
    "pre-push",
    "manual",
  ], require_serial = true },
  # Run the ty pinned by uv.lock so local hooks and CI check with one version.
  # ty checks the whole project rather than the staged files: a change in one
  # module can surface diagnostics in another.
  { id = "ty", name = "ty", entry = "uv run --all-packages --group lint ty check", language = "system", pass_filenames = false, types_or = [
    "python",
    "pyi",
  ], stages = [
    "pre-commit",
    "pre-push",
    "manual",
  ], require_serial = true },
]

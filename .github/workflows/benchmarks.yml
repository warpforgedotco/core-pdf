name: Benchmarks

on:
  pull_request:
  # CodSpeed compares a pull request against the run for its base commit, so
  # main has to be benchmarked too or there is nothing to compare against.
  # tests.yml is pull_request-only, which is why this workflow is not part of
  # it. workflow_dispatch replaces the manual trigger the retired weekly
  # benchmark workflow used to provide.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a pull request's own in-flight run, but let main's finish: a
  # cancelled run uploads a partial benchmark set, and main's is the baseline
  # every later comparison reads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codspeed:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@v3
        env:
          # CodSpeed counts instructions on a simulated CPU that serializes
          # threads, so any thread pool contributes its spin-wait loops to the
          # measurement instead of overlapping with real work. Left unpinned,
          # OpenBLAS made the numpy-backed benchmarks vary by orders of
          # magnitude between identical runs. One thread measures our own code.
          # The extraction benchmarks pin core-pdf's own worker pool for the
          # same reason; see tests/.../extract/benchmarks.
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        with:
          # No path list and no marker: --codspeed deselects every test that
          # is not a benchmark, so this runs all of them wherever they live and
          # picks up new ones automatically.
          run: >-
            uv run --locked --all-packages --group benchmark pytest
            --codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

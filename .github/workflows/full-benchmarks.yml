name: Weekly performance benchmarks

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: these runs upload to CodSpeed, and a cancelled or
# overlapping run would leave a partial benchmark set behind.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  targeted:
    name: Targeted benchmark inventory
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install English Tesseract data
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr-eng

      - name: Run targeted benchmarks
        uses: CodSpeedHQ/action@v3
        env:
          # Same reason as the CodSpeed job in tests.yml: the simulator
          # serializes threads, so a multi-threaded OpenBLAS measures its own
          # spin-waiting rather than our code, by up to three orders of
          # magnitude and nondeterministically.
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        with:
          run: >-
            uv run --locked --package core-pdf --group benchmark pytest
            $(grep -v '^#' .github/benchmark-paths.txt | tr '\n' ' ')
            --codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

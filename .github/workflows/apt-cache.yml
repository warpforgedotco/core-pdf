name: Package cache

# Caches saved by a pull request are visible to that pull request only, so this fills the
# package cache from main, where every pull request can restore it.
on:
  push:
    branches: [main]
    paths:
      - ".github/actions/install-pdf-tools/**"
      - ".github/workflows/apt-cache.yml"
      - "tests/upstream/pypdf"
      - "tests/compat/pypdf_test_files.tsv"
      - "scripts/fetch_pypdf_test_files.py"
  schedule:
    # Weekly, as runner images change about that often and each image has its own key.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fill:
    name: Fill the package cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Ghostscript, jbig2dec, Poppler and qpdf
        uses: ./.github/actions/install-pdf-tools

  pypdf-files:
    name: Fill the pypdf test file cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ghostscript, jbig2dec, Poppler and qpdf
        # pypdf skips its JBIG2 and Ghostscript tests without these tools, and a skipped test
        # asks for none of its files, so the recorded list would come up short.
        uses: ./.github/actions/install-pdf-tools

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore pypdf's downloaded test files
        uses: actions/cache@v6
        with:
          path: tests/upstream/pypdf/tests/pdf_cache
          key: pypdf-test-files-${{ hashFiles('tests/upstream/pypdf/tests/**/*.py', 'tests/upstream/pypdf/tests/example_files.yaml', 'tests/compat/pypdf_test_files.tsv') }}-v3
          restore-keys: pypdf-test-files-

      - name: Download every file pypdf's tests read
        # Runs pypdf's whole suite on the real pypdf, out-of-scope tests included, checks that
        # the files it asks for are the ones tests/compat/pypdf_test_files.tsv lists, and
        # fetches any the cache lacks. A file it cannot get fails the job, so the cache is
        # saved only when it is complete.
        run: uv run --locked --all-packages --group test python scripts/fetch_pypdf_test_files.py --record

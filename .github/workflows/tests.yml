name: Tests

on:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Install workspace packages and quality tools
        run: uv sync --locked --all-packages --group lint --group test

      - name: Build standalone distributions
        run: uv build --all-packages

      # setup-uv caches uv's own store, not prek's clones of the remote hook
      # repositories. Their revisions are pinned in prek.toml, so its hash is
      # an exact key.
      - name: Restore prek hook repositories
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  standalone:
    # Each floor package and the specification library must install with only
    # their own declared dependencies.
    name: Standalone / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core-records
          - core-postscript
          - core-jbig2
          - core-pdf-crypto
          - core-adobe-fonts
          - core-pdf-spec

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only the package
        run: uv sync --locked --package ${{ matrix.package }}

      - name: Prove higher tiers are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py ${{ matrix.package }}

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  core-isolation:
    # Core must never import or discover its companions: with only core-pdf and
    # its declared dependencies installed, core-pdf-ocr, core-pdf-validate, and
    # core-pdf-compat must be absent and the engine must still import.
    name: Core installs without its companions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only core
        run: uv sync --locked --package core-pdf

      - name: Prove the companions are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py core-pdf

      - name: Import the engine
        run: uv run --locked --no-sync python -c "import core_pdf; core_pdf.PdfDocument"

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  upstream-suites:
    # Each facade runs its reference library's own tests, so a failure here means a regression.
    name: Upstream suite / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - pdfplumber
          - pdfminer
          - xray
          - llamaindex
          - unstructured
          - pypdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Ghostscript, jbig2dec and Poppler
        # The package mirror sometimes hangs, so each try is bounded rather than using up the job.
        run: |
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get update -o Acquire::http::Timeout=20 &&
              sudo timeout 180 apt-get install --yes ghostscript jbig2dec poppler-utils && exit 0
            echo "Install attempt $attempt failed"
            sleep 5
          done
          exit 1

      - name: Run the suite against the facade
        run: uv run --locked --all-packages --group test python scripts/run_upstream_suite.py ${{ matrix.suite }}

      - name: Run the object model proofs
        if: matrix.suite == 'pypdf'
        run: |
          run="uv run --locked --all-packages --group test python scripts"
          $run/check_object_roundtrip.py
          $run/check_object_roundtrip.py --xref-stream
          $run/check_document_rewrite.py
          $run/check_document_rewrite.py --incremental
          $run/check_document_rewrite.py --xref-stream
          $run/check_document_rewrite.py --incremental --xref-stream
          $run/check_writer_lossless.py
          $run/check_encrypted_output.py
          $run/run_upstream_suite.py pypdf --reference
          $run/audit_upstream_skips.py pypdf

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

name: Tests

on:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Install workspace packages and quality tools
        run: uv sync --locked --all-packages --group lint --group test

      - name: Build standalone distributions
        run: uv build --all-packages

      # setup-uv caches uv's own store, not prek's clones of the remote hook
      # repositories. Their revisions are pinned in prek.toml, so its hash is
      # an exact key.
      - name: Restore prek hook repositories
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  standalone:
    # Each floor package and the specification library must install with only
    # their own declared dependencies.
    name: Standalone / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core-records
          - core-postscript
          - core-jbig2
          - core-pdf-crypto
          - core-adobe-fonts
          - core-pdf-spec

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only the package
        run: uv sync --locked --package ${{ matrix.package }}

      - name: Prove higher tiers are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py ${{ matrix.package }}

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  core-isolation:
    # Core must never import or discover its companions: with only core-pdf and
    # its declared dependencies installed, core-pdf-ocr, core-pdf-validate, and
    # core-pdf-compat must be absent and the engine must still import.
    name: Core installs without its companions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only core
        run: uv sync --locked --package core-pdf

      - name: Prove the companions are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py core-pdf

      - name: Import the engine
        run: uv run --locked --no-sync python -c "import core_pdf; core_pdf.PdfDocument"

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  upstream-suites:
    # Each facade runs its reference library's own tests, so a failure here means a regression.
    name: Upstream suite / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - pdfplumber
          - pdfminer
          - xray
          - llamaindex
          - unstructured
          - pypdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Name the runner image
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore Ghostscript, jbig2dec and Poppler packages
        # The package mirror is often slow, so the .deb files are kept between runs. The key
        # follows the runner image, whose own packages they must fit.
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-${{ steps.image.outputs.version }}-ghostscript-jbig2dec-poppler-v1

      - name: Install Ghostscript, jbig2dec and Poppler
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/apt-debs
            # Each try is bounded rather than using up the job, with room for a slow mirror.
            for attempt in 1 2 3; do
              sudo timeout 180 apt-get update -o Acquire::http::Timeout=30 &&
                sudo timeout 600 apt-get install --yes --download-only \
                  -o Dir::Cache::Archives="$HOME/apt-debs" \
                  ghostscript jbig2dec poppler-utils && break
              echo "Download attempt $attempt failed"
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
            sudo chown -R "$USER" ~/apt-debs
            rm -rf ~/apt-debs/partial ~/apt-debs/lock
          fi
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo dpkg -i ~/apt-debs/*.deb
          fi
          gs --version && jbig2dec --version && pdftoppm -v

      - name: Run the suite against the facade
        run: uv run --locked --all-packages --group test python scripts/run_upstream_suite.py ${{ matrix.suite }}

      - name: Run the object model proofs
        if: matrix.suite == 'pypdf'
        run: |
          run="uv run --locked --all-packages --group test python scripts"
          $run/check_object_roundtrip.py
          $run/check_object_roundtrip.py --xref-stream
          $run/check_document_rewrite.py
          $run/check_document_rewrite.py --incremental
          $run/check_document_rewrite.py --xref-stream
          $run/check_document_rewrite.py --incremental --xref-stream
          $run/check_writer_lossless.py
          $run/check_encrypted_output.py
          $run/check_save_statements.py
          uv run --locked --all-packages --group test --with "pypdf[full]==6.15.0" python scripts/check_pypdf_bytes.py
          uv run --locked --all-packages --group test --with "pypdf[full]==6.15.0" python scripts/check_pypdf_reads.py
          $run/run_upstream_suite.py pypdf --reference
          $run/audit_upstream_skips.py pypdf

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

name: Tests

on:
  pull_request:

permissions:
  contents: read

# A PR that is pushed to again supersedes its own in-flight run. Without this
# every push kept four jobs alive, one of them on a macOS runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules
        with:
          lfs: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: core-pdf / Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install English Tesseract data
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr-eng

      - name: Verify standard CPython
        run: >-
          uv run --locked --package core-pdf python -c
          "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 0"

      - name: Run core-pdf tests
        env:
          # Raster every corpus document, not just the 24-document covering
          # subset. The subset reaches every line of engine/render/, but it
          # cannot see output drift on the other 200: four snapshot digests
          # stayed unreachable for weeks precisely because only the subset ran
          # here. The full sweep costs a few minutes.
          CORE_PDF_RASTER_GOLDEN_FULL: "1"
        # -n auto was measured and reverted: 108s against 106s and 118s for
        # -n 2 on the same suite, i.e. inside the run-to-run noise. The job is
        # not CPU-parallel-bound, so widening the worker pool buys nothing.
        run: uv run --locked --package core-pdf --group test pytest -n 2

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  raster-portability:
    name: Raster portability / macOS ARM
    needs: quality
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Check irreversible JPEG 2000 raster portability
        run: >-
          uv run --locked --package core-pdf --group test pytest
          tests/test_rendering_golden.py
          -k "irreversible_jpx or tolerant_raster_references"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  codspeed:
    name: High-impact CodSpeed benchmarks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install English Tesseract data
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr-eng

      - name: Run high-impact CodSpeed benchmarks
        uses: CodSpeedHQ/action@v3
        with:
          run: >-
            uv run --locked --package core-pdf --group benchmark pytest
            $(grep -v '^#' .github/benchmark-paths.txt | tr '\n' ' ')
            -m benchmark_high_impact
            --codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

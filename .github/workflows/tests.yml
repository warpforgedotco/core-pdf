name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: core-pdf / Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch encrypted PDF fixture
        run: git -C tests/fixtures/SCORE-Bench lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run core-pdf tests
        run: uv run --locked --package core-pdf --group test pytest

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  core-ocr:
    name: core-ocr
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run core-ocr tests
        run: uv run --locked --package core-ocr --group test pytest packages/core-ocr/tests

      - name: Lint core-ocr
        run: uv run --locked --group lint ruff check packages/core-ocr/src packages/core-ocr/tests

      - name: Type-check core-ocr
        run: uv run --locked --group lint ty check packages/core-ocr/src/core_ocr

      - name: Build core-ocr
        run: uv build --package core-ocr

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

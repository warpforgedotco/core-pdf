name: Tests

on:
  pull_request:

permissions:
  contents: read

# unstructured 0.27 sends an analytics ping when it loads and prints a usage notice, unless
# these are set. The reference suite and comparison scripts run the real library.
env:
  DO_NOT_TRACK: "1"
  UNSTRUCTURED_DISABLE_NOTICE: "1"
  # unstructured[pdf] pulls in torch, and PyPI's Linux torch is the CUDA build: about 3 GB of
  # nvidia wheels a run, on runners without a GPU. These pages list only the CPU builds of
  # torch and torchvision, which uv prefers to PyPI's (a +cpu local version sorts higher), so
  # nothing else changes. Not --index: the CPU index also holds old copies of other packages
  # (certifi among them), and its first-index precedence breaks the resolution. The steps
  # that install unstructured[pdf] set UV_FIND_LINKS to this; no other job needs the site.
  CPU_TORCH_FIND_LINKS: https://download.pytorch.org/whl/cpu/torch/,https://download.pytorch.org/whl/cpu/torchvision/

# A new push supersedes the previous checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A pull request that changes only documentation skips the suites, proofs and install
    # checks, which read no Markdown; Quality and the build still run on it.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether anything besides documentation changed
        id: files
        run: |
          # The pull request's merge commit has the base branch as its first parent.
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Check the upstream checkouts sit at their pinned releases
        run: uv run --no-project python scripts/check_upstream_versions.py --checkouts

      - name: Install workspace packages and quality tools
        run: uv sync --locked --all-packages --group lint --group test

      # setup-uv caches uv's own store, not prek's clones of the remote hook
      # repositories. Their revisions are pinned in prek.toml, so its hash is
      # an exact key.
      - name: Restore prek hook repositories
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  build:
    # Apart from Quality, so the two slow steps run side by side.
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build standalone distributions
        run: uv build --all-packages

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  standalone:
    # Each floor package and the specification library must install with only
    # their own declared dependencies.
    # One job for all six: each check takes seconds, and a job per package held a runner each.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Standalone packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install each package alone and prove higher tiers are absent
        run: |
          for package in core-records; do
            echo "::group::$package"
            # Each sync replaces the environment with only this package and its dependencies.
            uv sync --locked --package "$package"
            uv run --locked --no-sync python scripts/check_package_isolation.py "$package"
            echo "::endgroup::"
          done

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  core-isolation:
    # Core must never import or discover its companions: with only core-pdf and
    # its declared dependencies installed, core-pdf-ocr, core-pdf-validate, and
    # core-pdf-compat must be absent and the engine must still import.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Core installs without its companions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only core
        run: uv sync --locked --package core-pdf

      - name: Prove the companions are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py core-pdf

      - name: Import the engine
        run: uv run --locked --no-sync python -c "import core_pdf; core_pdf.PdfDocument"

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  upstream-suites:
    # Each facade runs its reference library's own tests, so a failure here means a regression.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Upstream suite / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each suite runs its own library's tests, in that library's checkout alone.
        include:
          - suite: pdfplumber
            checkout: tests/upstream/pdfplumber
          - suite: pdfminer
            checkout: tests/upstream/pdfminer.six
          - suite: xray
            checkout: tests/upstream/x-ray
          - suite: llamaindex
            checkout: tests/upstream/llama_index
          - suite: unstructured
            checkout: tests/upstream/unstructured
          - suite: pypdf
            checkout: tests/upstream/pypdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out the suite's upstream checkout
        # Only the checkout the suite reads: cloning all of them, llama_index above all, took
        # about 25 s per job. --recursive brings pypdf's sample-files.
        run: git submodule update --init --recursive --depth 1 -- ${{ matrix.checkout }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Ghostscript, jbig2dec, Poppler and qpdf
        uses: ./.github/actions/install-pdf-tools
        with:
          # One job saves on a miss, until the Package cache workflow fills the key from main.
          save: ${{ matrix.suite == 'pdfminer' }}

      - name: Restore pypdf's downloaded test files
        # pypdf's tests fetch about 380 files from the web, and the harness downloads only what
        # the cache lacks. The Package cache workflow fills the cache from main; saving it here
        # too would keep a 420 MB copy for each pull request that changes pypdf's tests.
        if: matrix.suite == 'pypdf'
        uses: actions/cache/restore@v6
        with:
          path: tests/upstream/pypdf/tests/pdf_cache
          key: pypdf-test-files-${{ hashFiles('tests/upstream/pypdf/tests/**/*.py', 'tests/upstream/pypdf/tests/example_files.yaml', 'tests/compat/pypdf_test_files.tsv') }}-v3
          restore-keys: pypdf-test-files-

      - name: Run the suite against the facade
        run: uv run --locked --all-packages --group test python scripts/run_upstream_suite.py ${{ matrix.suite }}

      - name: Compare with the real pypdf
        if: matrix.suite == 'pypdf'
        run: |
          uv run --locked --all-packages --group test python scripts/run_upstream_suite.py pypdf --reference
          uv run --locked --all-packages --group test python scripts/audit_upstream_skips.py pypdf

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  proofs:
    # The object model proofs, in shards that run beside the suites.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Proofs / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # checkouts lists the upstream checkouts a shard's checks read; empty means all of
        # them. The checks skip a missing file without failing, so a shard must list every
        # checkout its globs and named files reach. check_native_state_operators.py names
        # files in llama_index, and the pdfminer, pdfplumber and unstructured checks glob
        # tests/upstream/**/*.pdf.
        include:
          - shard: core
            checkouts: tests/upstream/pdfminer.six tests/upstream/pdfplumber tests/upstream/pypdf tests/upstream/llama_index
          - shard: pypdf output
            checkouts: tests/upstream/pdfminer.six tests/upstream/pdfplumber tests/upstream/pypdf
          - shard: pypdf text
            checkouts: tests/upstream/pdfminer.six tests/upstream/pdfplumber tests/upstream/pypdf
          - shard: pdfminer and pdfplumber
            checkouts: ""
          - shard: unstructured
            checkouts: ""
          - shard: llama_index
            checkouts: tests/upstream/pdfminer.six tests/upstream/pdfplumber tests/upstream/pypdf
          - shard: x-ray
            checkouts: tests/upstream/pdfminer.six tests/upstream/pdfplumber tests/upstream/pypdf tests/upstream/x-ray

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out the upstream checkouts the shard reads
        # --recursive brings pypdf's sample-files.
        run: git submodule update --init --recursive --depth 1 -- ${{ matrix.checkouts }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Ghostscript, jbig2dec, Poppler and qpdf
        uses: ./.github/actions/install-pdf-tools

      - name: Restore pypdf's downloaded test files
        # The pypdf checks also read these files, so they compare the same pages as locally.
        if: startsWith(matrix.shard, 'pypdf')
        uses: actions/cache/restore@v6
        with:
          path: tests/upstream/pypdf/tests/pdf_cache
          key: pypdf-test-files-${{ hashFiles('tests/upstream/pypdf/tests/**/*.py', 'tests/upstream/pypdf/tests/example_files.yaml', 'tests/compat/pypdf_test_files.tsv') }}-v3
          restore-keys: pypdf-test-files-

      - name: Download the pypdf test files the cache lacks
        # A restore can fail ("The server is busy") or come from an older key; without this,
        # the checks would quietly compare fewer pages than a local run.
        if: startsWith(matrix.shard, 'pypdf')
        run: uv run --locked --all-packages --group test python scripts/fetch_pypdf_test_files.py

      - name: Serializer, rewrites and saves
        if: matrix.shard == 'core'
        run: |
          run="uv run --locked --all-packages --group test python scripts"
          $run/check_object_roundtrip.py
          $run/check_object_roundtrip.py --xref-stream
          $run/check_document_rewrite.py
          $run/check_document_rewrite.py --incremental
          $run/check_document_rewrite.py --xref-stream
          $run/check_document_rewrite.py --incremental --xref-stream
          $run/check_encrypted_output.py
          $run/check_pdf_mac.py
          $run/check_lazy_imports.py
          $run/check_area_gap_queue.py
          $run/check_strict_object_scanner.py
          $run/check_native_state_operators.py
          $run/check_indirect_object_scanner.py
          $run/check_object_writer.py
          $run/check_glyph_run_capture.py
          $run/check_plumber_chars.py
          $run/check_pdfminer_chars.py
          uv run --locked --all-packages --group test --with "pypdf[full]==7.0.0" python scripts/check_encrypt_readers.py

      - name: PdfWriter output, and bytes and reads against the real pypdf
        if: matrix.shard == 'pypdf output'
        run: |
          uv run --locked --all-packages --group test python scripts/check_writer_lossless.py
          uv run --locked --all-packages --group test python scripts/check_save_statements.py
          uv run --locked --all-packages --group test --with "pypdf[full]==7.0.0" python scripts/check_pypdf_bytes.py
          uv run --locked --all-packages --group test --with "pypdf[full]==7.0.0" python scripts/check_pypdf_reads.py

      - name: pypdf text against the real pypdf
        if: matrix.shard == 'pypdf text'
        run: uv run --locked --all-packages --group test --with "pypdf[full]==7.0.0" python scripts/check_pypdf_text.py

      - name: pdfminer and pdfplumber against the real libraries
        if: matrix.shard == 'pdfminer and pdfplumber'
        run: |
          uv run --locked --all-packages --group test --with "pdfminer.six==20260107" python scripts/check_pdfminer_output.py
          uv run --locked --all-packages --group test --with "pdfplumber==0.11.10" python scripts/check_pdfplumber_output.py

      # unstructured, llama_index and x-ray each have a shard: in one job they took about 16 min,
      # the longest of the run.
      # unstructured[pdf] needs onnxruntime, which has no CPython 3.15 wheels yet, so the real
      # library runs on 3.14 in its own environment, between listing and comparing on 3.15.
      - name: unstructured against the real library
        if: matrix.shard == 'unstructured'
        env:
          UV_FIND_LINKS: ${{ env.CPU_TORCH_FIND_LINKS }}
        run: |
          mkdir -p .upstream-results
          uv run --locked --all-packages --group test python scripts/check_unstructured_output.py --list .upstream-results/unstructured-files.txt
          uv run --python 3.14 --isolated --no-project --with "unstructured[pdf]==0.27.37" python scripts/check_unstructured_output.py --record .upstream-results/unstructured-files.txt .upstream-results/unstructured-real.json
          uv run --locked --all-packages --group test --extra unstructured python scripts/check_unstructured_output.py --compare .upstream-results/unstructured-files.txt .upstream-results/unstructured-real.json

      - name: llama_index against the real library
        if: matrix.shard == 'llama_index'
        # llama-index-readers-file 0.7.0 resolves pandas 2.3.3, which has no CPython 3.15 wheels,
        # so uv builds it from source, about 4 min a run, until it has.
        run: uv run --locked --all-packages --group test --with "llama-index-readers-file==0.7.0" --with "llama-index-core==0.14.25" --with "pypdf[full]==6.21.4" python scripts/check_llamaindex_output.py

      - name: x-ray against the real library
        if: matrix.shard == 'x-ray'
        run: uv run --locked --all-packages --group test --with "x-ray==0.4.0" --with "pymupdf==1.24.14" python scripts/check_xray_output.py

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

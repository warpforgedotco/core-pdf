name: Tests

on:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules
        with:
          lfs: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Install workspace packages and quality tools
        run: uv sync --locked --all-packages --group lint --group test

      - name: Run strict spec and integration tests
        run: uv run --locked --all-packages --group test pytest packages/core-pdf-spec/tests tests/src/core_pdf/spec_boundary

      - name: Build and verify standalone distributions
        run: |
          uv build --all-packages
          uv run --locked --all-packages python scripts/check_spec_distribution.py dist --fixture "tests/fixtures/pdf20examples/Simple PDF 2.0 file.pdf"

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  differential:
    name: Differential / Python 3.13
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install core-pdf and reference libraries
        run: uv sync --locked --package core-pdf --extra unstructured --group test --group vendor-test

      - name: Run differential tests
        run: >-
          uv run --locked --package core-pdf --extra unstructured --group test --group vendor-test pytest
          tests/src/core_pdf/api/compat/differential/ -n 2

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

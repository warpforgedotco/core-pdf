name: Tests

on:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      # vendor-test supplies the reference libraries the compat differential
      # tests import at module level, which ty must resolve.
      - name: Install workspace packages and quality tools
        run: uv sync --locked --all-packages --group lint --group test --group vendor-test

      - name: Run strict spec, standards, and validation tests
        run: >-
          uv run --locked --all-packages --group test pytest
          packages/core-pdf-spec/tests
          packages/core-pdf-validate/tests
          packages/core-predictors/tests
          packages/core-postscript/tests
          packages/core-jbig2/tests
          packages/core-pdf-crypto/tests
          packages/core-adobe-fonts/tests

      - name: Build standalone distributions
        run: uv build --all-packages

      # setup-uv caches uv's own store, not prek's clones of the remote hook
      # repositories. Their revisions are pinned in prek.toml, so its hash is
      # an exact key.
      - name: Restore prek hook repositories
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  verapdf:
    name: veraPDF 1.30.2 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The integration tests validate one PDF/A file and one PDF 2.0 file.
      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules
        with:
          lfs: "false"
          paths: tests/fixtures/pypdf tests/fixtures/pdf20examples

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install validation companion and tests
        run: uv sync --locked --package core-pdf --package core-pdf-validate --group test

      - name: Install checksum-pinned veraPDF in temporary storage
        run: uv run --locked --no-sync python scripts/install_verapdf_ci.py "$RUNNER_TEMP/verapdf"

      - name: Check real passes and failures for every advertised profile
        env:
          CORE_PDF_VERAPDF: ${{ runner.temp }}/verapdf/verapdf
          CORE_PDF_REQUIRE_VERAPDF: "1"
          COVERAGE_FILE: .coverage.verapdf
          JAVA_TOOL_OPTIONS: -Duser.home=${{ runner.temp }}/verapdf
        run: >-
          uv run --locked --no-sync pytest
          packages/core-pdf-validate/tests/test_verapdf_integration.py
          --cov --cov-config=pyproject.toml --cov-report=term -ra

      - name: Upload validator coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-verapdf
          path: .coverage.verapdf
          include-hidden-files: true
          if-no-files-found: error

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  standalone:
    # Each floor package and the specification library must import and pass
    # their tests with only their own declared dependencies installed.
    name: Standalone / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core-predictors
          - core-postscript
          - core-jbig2
          - core-pdf-crypto
          - core-adobe-fonts
          - core-pdf-spec

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install only the package and the test tools
        run: uv sync --locked --package ${{ matrix.package }} --group test

      - name: Prove higher tiers are absent
        run: uv run --locked --no-sync python scripts/check_package_isolation.py ${{ matrix.package }}

      - name: Run the package's tests
        run: uv run --locked --no-sync pytest packages/${{ matrix.package }}/tests -p no:cacheprovider

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  workspace:
    name: Workspace suite / Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore fixture submodules
        uses: ./.github/actions/cache-submodules

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace and reference libraries
        run: uv sync --locked --all-packages --extra unstructured --group test --group vendor-test

      - name: Install pinned OCR test model and verify linked engine
        run: uv run --locked --no-sync python scripts/install_ocr_ci.py "$RUNNER_TEMP/tessdata"

      - name: Run complete workspace with coverage
        env:
          CORE_PDF_TESSERACT_TESTS: "1"
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata
          COVERAGE_FILE: .coverage.workspace
        run: >-
          uv run --locked --no-sync pytest -n 2
          --cov --cov-config=pyproject.toml --cov-report=term -ra

      - name: Upload workspace coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-workspace
          path: .coverage.workspace
          include-hidden-files: true
          if-no-files-found: error

      - name: Prune uv cache
        if: ${{ always() && !cancelled() }}
        run: uv cache prune --ci

  differential:
    # Preserve the existing required status name while gating the complete suite.
    name: Differential / Python 3.14
    needs: [workspace, verapdf]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both test jobs to pass
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          VALIDATOR_RESULT: ${{ needs.verapdf.result }}
        run: test "$WORKSPACE_RESULT" = success && test "$VALIDATOR_RESULT" = success

      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"

      - name: Install coverage tools
        run: uv sync --locked --only-group test

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data

      - name: Combine and report complete coverage
        run: |
          uv run --locked --no-sync coverage combine coverage-data
          uv run --locked --no-sync coverage html
          uv run --locked --no-sync coverage json
          uv run --locked --no-sync coverage report

      - name: Publish coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: workspace-coverage
          path: |
            htmlcov/
            .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce statement and branch ratchets
        run: uv run --locked --no-sync python scripts/check_coverage.py

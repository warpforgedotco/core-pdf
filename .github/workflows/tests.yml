name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Run prek
        run: uvx prek run --all-files --stage pre-push

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: core-pdf / Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch encrypted PDF fixture
        run: git -C tests/fixtures/SCORE-Bench lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install English Tesseract data
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr-eng

      - name: Verify standard CPython
        run: >-
          uv run --locked --package core-pdf python -c
          "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 0"

      - name: Run core-pdf tests
        run: uv run --locked --package core-pdf --group test pytest

      - name: Capture OCR batching benchmark baseline
        run: >-
          uv run --locked --package core-pdf --group benchmark pytest
          tests/benchmarks/test_page_program_benchmarks.py::test_multi_region_ocr_batch_benchmark
          --benchmark-only --benchmark-json=ocr-batching-benchmark.json

      - name: Upload OCR batching benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: ocr-batching-benchmark-${{ matrix.python-version }}
          path: ocr-batching-benchmark.json

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  codspeed:
    name: High-impact CodSpeed benchmarks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch encrypted PDF fixture
        run: git -C tests/fixtures/SCORE-Bench lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install English Tesseract data
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr-eng

      - name: Run high-impact CodSpeed benchmarks
        uses: CodSpeedHQ/action@v3
        with:
          run: >-
            uv run --locked --package core-pdf --group benchmark pytest
            tests/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_content/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_document/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_filters/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_objects/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_security/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_07_syntax/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_08_graphics/benchmarks
            tests/src/core_pdf/impl/engine/spec/s_09_fonts/benchmarks
            -m benchmark_high_impact
            --codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}

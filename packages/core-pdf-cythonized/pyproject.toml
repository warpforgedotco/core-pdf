[project]
name = "core-pdf-cythonized"
version = "0.1.0"
description = "Compiled kernels for core-pdf hot paths"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=80", "wheel", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf_cythonized = ["py.typed", "*.pyi", "*.pyx"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.cibuildwheel]
# The workspace is Python 3.14+ only, and nothing here works on a
# non-CPython interpreter: the kernels are CPython C-API extensions. The
# selector already excludes PyPy and the free-threaded cp314t builds, so no
# skip list is needed -- an explicit `skip = ["pp*"]` makes cibuildwheel
# enable the PyPy group purely to exclude it again.
#
# cibuildwheel must be new enough to know cp314: v2.x selects nothing at all
# and exits 3 with "No build identifiers selected".
build = "cp314-*"
build-frontend = "build"

# The golden vectors are the point of running tests here. They pin the
# kernels' float arithmetic bit for bit, and float behaviour is exactly what a
# different compiler on a different platform can change -- an FMA contraction
# moves a root by one ULP. This repo otherwise tests on Linux only, so these
# vectors are the only thing standing between a Windows or macOS wheel and
# silently different output.
test-requires = ["pytest", "numpy>=2.5.1"]
test-command = "pytest -q {package}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]


[tool.cibuildwheel.windows]
archs = ["AMD64"]

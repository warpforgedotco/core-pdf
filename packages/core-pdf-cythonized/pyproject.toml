[project]
name = "core-pdf-cythonized"
version = "0.1.0"
description = "Compiled kernels for core-pdf hot paths"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.1",
]

[build-system]
requires = ["setuptools>=80", "wheel", "Cython>=3.1", "numpy>=2.5.1"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/warpforgedotco/core-pdf"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf_cythonized = ["py.typed", "*.pyi"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.cibuildwheel]
# The workspace is Python 3.15+ only, and nothing here works on a
# non-CPython interpreter: the kernels are CPython C-API extensions. The
# selector already excludes PyPy and the free-threaded cp315t builds,
# so no skip list is needed -- an explicit `skip = ["pp*"]` makes cibuildwheel
# enable the PyPy group purely to exclude it again.
#
# cp315 needs cibuildwheel v4.3.1 or later to build against the final 3.15.0
# rather than a release candidate; older versions select nothing and exit 3
# with "No build identifiers selected".
build = ["cp315-*"]
build-frontend = "build"

# Architectures come from CIBW_ARCHS in .github/workflows/wheels.yml, one
# native architecture per runner.

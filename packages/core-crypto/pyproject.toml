[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "core-crypto"
version = "0.0.1"
description = "Reusable cryptographic primitives for PDF security handlers"
readme = "README.md"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/core-experiments/core-crypto"

[dependency-groups]
test = ["pytest>=8.4.0,<10.0.0"]
lint = ["ruff>=0.11.13,<1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

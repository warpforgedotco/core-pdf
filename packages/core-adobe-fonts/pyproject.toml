[project]
name = "core-adobe-fonts"
version = "0.2.0"
description = "Adobe font format kernels: CFF, Type 2, Type 1, CMaps, AGL, Core 14 metrics"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.14"
dependencies = [
    "core-records>=0.1.0,<0.2.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_adobe_fonts = ["py.typed"]
"core_adobe_fonts.cmap" = ["data/cmaps/**"]
"core_adobe_fonts._vendor.font_data" = ["LICENSE*", "*.md"]
"core_adobe_fonts.afm" = ["*.txt", "*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "*.pdf", "**/*.pdf"]

[tool.uv.sources]
core-records = { workspace = true }

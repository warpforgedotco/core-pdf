[project]
name = "core-pdf-spec"
version = "0.4.0"
description = "PDF specification algorithms and semantic interfaces"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.13"
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.0",
    "numpy>=2.5.1",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf_spec = ["py.typed"]
"core_pdf_spec.s_09_fonts" = ["data/cmaps/**"]
"core_pdf_spec._vendor.font_data" = ["LICENSE*", "*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "*.pdf", "**/*.pdf"]

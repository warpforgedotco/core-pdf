[project]
name = "core-pdf-spec"
version = "0.5.0"
description = "PDF specification algorithms and semantic interfaces"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.14"
dependencies = [
    "core-adobe-fonts>=0.1.0,<0.2.0",
    "core-jbig2>=0.1.0,<0.2.0",
    "core-pdf-crypto>=0.1.0,<0.2.0",
    "core-postscript>=0.1.0,<0.2.0",
    "core-predictors>=0.1.0,<0.2.0",
    "numpy>=2.5.1",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf_spec = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "*.pdf", "**/*.pdf"]

[tool.uv.sources]
core-predictors = { workspace = true }
core-postscript = { workspace = true }
core-jbig2 = { workspace = true }
core-pdf-crypto = { workspace = true }
core-adobe-fonts = { workspace = true }

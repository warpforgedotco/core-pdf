[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "core-pdf"
version = "0.0.5"
description = "High-Performance PDF Engine"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "core-ccitt>=0.0.1",
    "core-color>=0.0.1",
    "core-cmap>=0.0.1",
    "core-font-programs>=0.0.1",
    "core-jbig2>=0.0.1",
    "core-jpeg>=0.0.0",
    "core-layout>=0.0.1",
]

[tool.uv.sources]
core-ccitt = { workspace = true }
core-color = { workspace = true }
core-cmap = { workspace = true }
core-font-programs = { workspace = true }
core-jbig2 = { workspace = true }
core-jpeg = { workspace = true }
core-layout = { workspace = true }

[tool.uv.workspace]
members = [
    "../core-CCITT",
    "../core-JBIG2",
    "../core-JPEG",
    "../core-cmap",
    "../core-color",
    "../core-font-programs",
    "../core-layout",
]

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"
License = "https://github.com/core-experiments/core-pdf/blob/main/LICENSE.txt"
"License documentation" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/README.md"
"Commercial license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-COMMERCIAL.txt"
"Evaluation license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-EVALUATION.txt"
"Philanthropy waiver terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-PHILANTHROPY-WAIVER.txt"

[dependency-groups]
dev = [
    { include-group = "benchmark" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "vendor" },
]
benchmark = [
    "rich>=15.0.0",
]
vendor = [
    "vendoring >=0.2.2",
]
lint = [
    "mypy >=1.16.0, <2.0.0",
    "ruff >=0.11.13, <1.0.0",
    "ty >=0.0.59, <1.0.0",
]
test = [
    "pdfminer.six",
    "pytest >=8.4.0, <10.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
extend-exclude = [
    "src/core_pdf/impl/third_party",
    "src/core_pdf/integrations/pdfminer/six/_vendor",
    "tests/fixtures",
]
line-length = 100

[tool.ruff.lint]
select = [
    "C4",      # flake8-comprehensions
    "COM",     # flake8-commas
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort (imports)
    "PLR0402", # Name compared with itself like `foo == foo`
    "PT",      # flake8-pytest-style
    "SIM",     # flake8-simplify
    "UP015",   # redundant `open()` mode parameter (like "r" is default)
    "UP018",   # Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal)
    "UP032",   # Use f-string instead of `.format()` call
    "UP034",   # Avoid extraneous parentheses
]

ignore = [
    "COM812", # over aggressively insists on trailing commas where not desirable
    "PT001",  # use @pytest.fixture() over @pytest.fixture
    "PT011",  # pytest.raises({exc}) too broad, use match param or more specific exception
    "PT012",  # pytest.raises() block should contain a single simple statement
    "PT023",  # use @pytest.mark.asyncio() over @pytest.mark.asyncio
    "SIM108", # ignore encouraging use of ternary operator
    "SIM117", # merge `with` statements for context managers that have same scope
]

[tool.mypy]
python_version = "3.11"
files = ["src/core_pdf"]
mypy_path = "src"
exclude = ["src/core_pdf/integrations/pdfminer/six/_vendor"]
show_error_codes = true

[[tool.mypy.overrides]]
module = "core_pdf.impl.third_party._vendor.*"
ignore_errors = true

[tool.ty.src]
exclude = [
    "src/core_pdf/impl/third_party",
    "src/core_pdf/integrations/pdfminer/six/_vendor",
    "tests/fixtures",
]

[tool.vendoring]
destination = "src/core_pdf/impl/third_party/_vendor/"
requirements = "src/core_pdf/impl/third_party/_vendor/vendor.txt"
namespace = "core_pdf.impl.third_party._vendor"
protected-files = ["__init__.py", "README.rst", "vendor.txt"]
patches-dir = "tools/vendoring/patches"

[tool.vendoring.transformations]
substitute = [
    { match = "(?m)^import fontTools\\.encodings\\.codecs$", replace = "import fontTools.encodings.codecs as codecs" },
    { match = "(?m)^import fontTools\\.merge\\.base$", replace = "import fontTools.merge.base as merge_base" },
    { match = "(?m)^import fontTools\\.merge\\.tables$", replace = "import fontTools.merge.tables as merge_tables" },
    { match = "(?m)^import fontTools\\.otlLib\\.builder$", replace = "import fontTools.otlLib.builder as otl_lib_builder" },
    { match = "(?m)^import fontTools\\.subset\\.cff$", replace = "import fontTools.subset.cff as subset_cff" },
    { match = "(?m)^import fontTools\\.varLib\\.varStore  # For monkey-patching$", replace = "import fontTools.varLib.varStore as var_store  # For monkey-patching" },
    { match = '"fontTools\.ttLib\.tables\."', replace = '"core_pdf.impl.third_party._vendor.fontTools.ttLib.tables."' },
]
drop = [
    "*.dist-info/",
    "bin/",
    "share/",
    "*.so",
    "*.pyd",
]

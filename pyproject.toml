[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-pdf"
version = "0.0.7"
description = "High-Performance PDF Engine"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "numpy>=2.5.1",
    "imagecodecs>=2026.6.26",
    "defusedxml>=0.7.1",
    "core-pdf-spec>=0.12.0,<0.13.0",
    "core-jbig2>=0.3.1,<0.4.0",
    "core-adobe-fonts>=0.2.1,<0.3.0",
    "core-pdf-cythonized>=0.1.0,<0.2.0",
    "core-records>=0.1.0,<0.2.0",
]

[project.scripts]
core-pdf = "core_pdf.cli:main"

[tool.uv]
python-preference = "system"

[tool.uv.workspace]
members = [
    "packages/core-pdf-ocr",
    "packages/core-pdf-compat",
    "packages/core-pdf-spec",
    "packages/core-pdf-validate",
    "packages/core-postscript",
    "packages/core-jbig2",
    "packages/core-pdf-crypto",
    "packages/core-adobe-fonts",
    "packages/core-records",
    "packages/core-pdf-cythonized",
]

[tool.uv.sources]
core-pdf-cythonized = { workspace = true }
core-records = { workspace = true }
core-pdf-spec = { workspace = true }
core-jbig2 = { workspace = true }
core-adobe-fonts = { workspace = true }

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"
License = "https://github.com/core-experiments/core-pdf/blob/main/LICENSE.txt"
"License documentation" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/README.md"
"Commercial license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-COMMERCIAL.txt"
"Evaluation license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-EVALUATION.txt"
"Philanthropy waiver terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-PHILANTHROPY-WAIVER.txt"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "import-linter>=2.13",
    "mypy >=1.16.0, <2.0.0",
    "ruff >=0.11.13, <1.0.0",
    "ty >=0.0.59, <1.0.0",
]
test = [
    "coverage>=7.16.1",
    "pillow>=12.2.0",
    "pytest >=8.4.0, <10.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
compiling = [
    "nuitka>=4.1.3",
]
vendor-test = [
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.11.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "unstructured[pdf]>=0.25.2",
]
benchmark = [
    "pytest-codspeed>=5.0.3",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/src/core_pdf",
    "packages/core-pdf-compat/tests",
    "packages/core-pdf-ocr/tests",
    "packages/core-pdf-spec/tests",
    "packages/core-pdf-validate/tests",
    "packages/core-pdf-cythonized/tests",
    "packages/core-postscript/tests",
    "packages/core-jbig2/tests",
    "packages/core-pdf-crypto/tests",
    "packages/core-adobe-fonts/tests",
    "packages/core-records/tests",
]
addopts = "--import-mode=importlib"
norecursedirs = ["tests/fixtures"]
# The spec tests import their shared scaffolding, _content_support, by name.
pythonpath = [".", "packages/core-pdf-spec/tests"]
markers = [
    "compat_differential: compares supported facades against reference libraries",
]

[tool.coverage.run]
branch = true
source = [
    "src/core_pdf",
    "packages/core-pdf-ocr/src/core_pdf_ocr",
    "packages/core-pdf-compat/src/core_pdf_compat",
    "packages/core-pdf-spec/src/core_pdf_spec",
    "packages/core-pdf-validate/src/core_pdf_validate",
    "packages/core-postscript/src/core_postscript",
    "packages/core-jbig2/src/core_jbig2",
    "packages/core-pdf-crypto/src/core_pdf_crypto",
    "packages/core-adobe-fonts/src/core_adobe_fonts",
    "packages/core-records/src/core_records",
    "packages/core-pdf-cythonized/src/core_pdf_cythonized",
]
omit = ["*/_vendor/*"]
relative_files = true

[tool.coverage.report]
precision = 2

[tool.coverage.json]
output = "htmlcov/coverage.json"

[tool.ruff]
src = ["src", "packages/core-pdf-ocr/src", "packages/core-pdf-compat/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src", "packages/core-records/src", "packages/core-pdf-cythonized/src", "."]
extend-exclude = [
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Test doubles and scripts accept signatures they do not use.
"tests/**" = ["ARG"]
"packages/*/tests/**" = ["ARG"]
"conftest.py" = ["ARG"]
"scripts/**" = ["ARG"]
# Operator handlers share one dispatch signature: (operands, depth).
"packages/core-pdf-spec/src/core_pdf_spec/s_07_content/interpreter.py" = ["ARG002"]
"packages/core-pdf-compat/src/core_pdf_compat/pdfminer/_capture.py" = ["ARG002"]
# Stream filters share the FilterFn signature: (data, parms).
"packages/core-pdf-spec/src/core_pdf_spec/s_07_filters/codecs.py" = ["ARG001"]
"src/core_pdf/impl/graphics_stream_decoding.py" = ["ARG001"]
# FURB136 rewrites `a if a < b else b` back into min()/max(). Both spellings
# are fine, but min(a, b) is a call with tuple packing where the conditional
# is a compare and a jump -- measured 3.2x cheaper. These run per glyph, over
# coordinates as_floats has already proved finite, so the NaN difference the
# two spellings have cannot arise here.
"src/core_pdf/impl/capture_glyphs.py" = ["FURB136"]
# Scanner callbacks share the (data, pos, ..., semantic_context) signature.
"src/core_pdf/impl/recovery_xref.py" = ["ARG001", "ARG004"]
# Content operator handlers and semantic-sink callbacks share fixed signatures.
"src/core_pdf/impl/capture_tolerant_state.py" = ["ARG002"]
"src/core_pdf/impl/capture_recording.py" = ["ARG002"]
# Documented parsing extension hooks keep their signatures, in the strict base
# and in the recovery overrides.
"packages/core-pdf-spec/src/core_pdf_spec/s_07_syntax/lexer.py" = ["ARG002"]
"packages/core-pdf-spec/src/core_pdf_spec/s_07_syntax/objects.py" = ["ARG002"]
"packages/core-pdf-spec/src/core_pdf_spec/s_07_syntax/resolver.py" = ["ARG002"]
"packages/core-pdf-spec/src/core_pdf_spec/s_07_content/streams.py" = ["ARG002"]
"src/core_pdf/impl/recovery_lexer.py" = ["ARG002"]
"src/core_pdf/impl/recovery_resolver.py" = ["ARG002"]
"src/core_pdf/impl/fonts_cmap_tounicode.py" = ["ARG002"]
[tool.ruff.lint.mccabe]
max-complexity = 60

[tool.ruff.lint]
# The codebase names deliberately unused bindings ignored_*; treat them as dummies.
dummy-variable-rgx = "^(_+|_[a-zA-Z0-9_]*|ignored(_.*)?)$"
select = [
    "ARG",     # unused arguments
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "C90",     # mccabe complexity
    "COM",     # flake8-commas
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "FURB",    # refurb modernisations
    "I",       # isort (imports)
    "PERF",    # perflint
    "PIE",     # flake8-pie
    "PLR1714", # repeated equality comparison
    "PLR5501", # collapsible else-if
    "PLR0402", # Name compared with itself like `foo == foo`
    "PT",      # flake8-pytest-style
    "RET504",  # unnecessary assignment before return
    "RET505",  # superfluous else after return
    "SIM",     # flake8-simplify
    "UP035",   # deprecated typing imports
    "UP037",   # quoted annotations under future annotations
    "UP046",   # PEP 695 generic classes
    "UP047",   # PEP 695 generic functions
    "UP015",   # redundant `open()` mode parameter (like "r" is default)
    "UP018",   # Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal)
    "UP032",   # Use f-string instead of `.format()` call
    "UP034",   # Avoid extraneous parentheses
]

ignore = [
    # The one getattr() flagged reads an attribute that the vendored fontTools
    # DirectoryEntry does not declare; `ty` rejects direct attribute access there.
    "B009",   # getattr with a constant attribute value
    # Every zip() flagged here is either preceded by an explicit length check or
    # is an intentional pairwise zip(xs, xs[1:]); strict=True would be wrong.
    "B905",   # zip() without an explicit strict=
    "COM812", # over aggressively insists on trailing commas where not desirable
    "PT011",  # pytest.raises({exc}) too broad, use match param or more specific exception
    "PT012",  # pytest.raises() block should contain a single simple statement
    "SIM108", # ignore encouraging use of ternary operator
    "SIM117", # merge `with` statements for context managers that have same scope
]

[tool.mypy]
python_version = "3.14"
files = ["src/core_pdf", "packages/core-pdf-ocr/src/core_pdf_ocr", "packages/core-pdf-compat/src/core_pdf_compat", "packages/core-pdf-spec/src/core_pdf_spec", "packages/core-pdf-validate/src/core_pdf_validate", "packages/core-postscript/src/core_postscript", "packages/core-jbig2/src/core_jbig2", "packages/core-pdf-crypto/src/core_pdf_crypto", "packages/core-adobe-fonts/src/core_adobe_fonts", "packages/core-records/src/core_records", "packages/core-pdf-cythonized/src/core_pdf_cythonized"]
mypy_path = ["src", "packages/core-pdf-ocr/src", "packages/core-pdf-compat/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src", "packages/core-records/src", "packages/core-pdf-cythonized/src"]
exclude = ["src/core_pdf/_vendor/fontTools"]
show_error_codes = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ty.environment]
root = [".", "packages/core-pdf-spec/tests", "src", "packages/core-pdf-ocr/src", "packages/core-pdf-compat/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src", "packages/core-records/src", "packages/core-pdf-cythonized/src"]

[tool.ty.src]
exclude = [
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
    # Runs in the isolated PEP 517 build environment, where Cython is present
    # and the dev venv it would be checked against is not.
    "packages/core-pdf-cythonized/setup.py",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf = ["py.typed"]
"core_pdf._vendor.fontTools" = ["LICENSE.txt", "LICENSE.external.txt"]
"core_pdf._vendor.icc" = ["*.icc", "README.md"]
"core_pdf._vendor.fontTools.ttLib.tables" = ["table_API_readme.txt"]
"core_pdf.impl.data.wordlists" = [
    "*.txt.gz",
    "*.bin",
    "*.md",
    "LICENSE*",
]
"core_pdf.impl.data" = ["raster_fonts/**"]

[tool.importlinter]
root_packages = [
    "core_pdf",
    "core_pdf_ocr",
    "core_pdf_compat",
    "core_pdf_spec",
    "core_pdf_validate",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
    "core_records",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Core never depends on OCR"
type = "forbidden"
source_modules = ["core_pdf"]
forbidden_modules = ["core_pdf_ocr"]

[[tool.importlinter.contracts]]
name = "Validation is an opt-in companion"
type = "forbidden"
source_modules = ["core_pdf", "core_pdf_spec", "core_pdf_ocr", "core_pdf_compat"]
forbidden_modules = ["core_pdf_validate"]

[[tool.importlinter.contracts]]
name = "Validation uses only public core interfaces"
type = "forbidden"
source_modules = ["core_pdf_validate"]
forbidden_modules = ["core_pdf.impl", "core_pdf_ocr", "core_pdf_compat"]
allow_indirect_imports = true

# The facades reach into core_pdf.impl by design and pin the exact core
# release; core, spec, and the other companions must never import or discover
# them, so users opt in by installing core-pdf-compat.
[[tool.importlinter.contracts]]
name = "Compat is an opt-in companion"
type = "forbidden"
source_modules = ["core_pdf", "core_pdf_spec", "core_pdf_ocr", "core_pdf_validate"]
forbidden_modules = ["core_pdf_compat"]

[[tool.importlinter.contracts]]
name = "Compat stays beside the other companions"
type = "forbidden"
source_modules = ["core_pdf_compat"]
forbidden_modules = ["core_pdf_ocr", "core_pdf_validate"]

[[tool.importlinter.contracts]]
name = "Standards records stay below chapter algorithms"
type = "forbidden"
source_modules = ["core_pdf_spec.standards"]
forbidden_modules = [
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

[[tool.importlinter.contracts]]
name = "OCR implementation stays below public APIs"
type = "forbidden"
source_modules = ["core_pdf_ocr.impl"]
forbidden_modules = ["core_pdf_ocr.api"]

[[tool.importlinter.contracts]]
name = "Derived-processing spine: rendering stays below extraction"
type = "forbidden"
source_modules = [
    "core_pdf.impl.render_blend",
    "core_pdf.impl.render_clipping",
    "core_pdf.impl.render_commands",
    "core_pdf.impl.render_display",
    "core_pdf.impl.render_model",
    "core_pdf.impl.render_page",
    "core_pdf.impl.render_paths",
    "core_pdf.impl.render_patterns",
    "core_pdf.impl.render_target",
]
forbidden_modules = [
    "core_pdf.impl.extract_block_layout",
    "core_pdf.impl.extract_capture",
    "core_pdf.impl.extract_contracts",
    "core_pdf.impl.extract_emit",
    "core_pdf.impl.extract_grids",
    "core_pdf.impl.extract_pipeline",
    "core_pdf.impl.extract_quality",
    "core_pdf.impl.extract_selection",
    "core_pdf.impl.extract_table_cleanup",
    "core_pdf.impl.extract_table_detection",
]

[[tool.importlinter.contracts]]
name = "Derived-processing spine: layout and output stay below rendering and extraction"
type = "forbidden"
source_modules = [
    "core_pdf.impl.layout_lines",
    "core_pdf.impl.layout_reconstruction",
    "core_pdf.impl.layout_text_rules",
    "core_pdf.impl.output_model",
    "core_pdf.impl.output_serialize",
]
forbidden_modules = [
    "core_pdf.impl.extract_block_layout",
    "core_pdf.impl.extract_capture",
    "core_pdf.impl.extract_contracts",
    "core_pdf.impl.extract_emit",
    "core_pdf.impl.extract_grids",
    "core_pdf.impl.extract_pipeline",
    "core_pdf.impl.extract_quality",
    "core_pdf.impl.extract_selection",
    "core_pdf.impl.extract_table_cleanup",
    "core_pdf.impl.extract_table_detection",
    "core_pdf.impl.render_blend",
    "core_pdf.impl.render_clipping",
    "core_pdf.impl.render_commands",
    "core_pdf.impl.render_display",
    "core_pdf.impl.render_model",
    "core_pdf.impl.render_page",
    "core_pdf.impl.render_paths",
    "core_pdf.impl.render_patterns",
    "core_pdf.impl.render_target",
]
layers = [
    "extract",
    "render",
    "output : layout",
]

[[tool.importlinter.contracts]]
name = "Serialization stays below processing and the specification"
type = "forbidden"
source_modules = ["core_pdf.impl.output_serialize"]
ignore_imports = ["core_pdf.impl.geometry -> core_pdf_spec.s_08_graphics.geometry"]
forbidden_modules = [

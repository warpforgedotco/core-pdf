[[tool.importlinter.contracts]]
name = "Spec never depends on core or OCR"
type = "forbidden"
source_modules = ["core_pdf_spec"]
forbidden_modules = ["core_pdf", "core_pdf_ocr"]

# Each standards package implements one external standard (T.88, PNG/TIFF
# predictors, PLRM calculator, CMS/PDF MAC ciphers, Adobe font formats) and is
# the workspace floor: PDF glue stays in the spec chapter that cites it.
[[tool.importlinter.contracts]]
name = "Standards packages are the workspace floor"
type = "forbidden"
source_modules = [
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]
forbidden_modules = ["core_pdf", "core_pdf_ocr", "core_pdf_spec", "core_pdf_validate", "core_pdf_compat"]

# The value-class mixins every other workspace package may import, so they
# import none of them.
[[tool.importlinter.contracts]]
name = "core_records imports no other workspace package"
type = "forbidden"
source_modules = ["core_records"]
forbidden_modules = [
    "core_pdf",
    "core_pdf_ocr",
    "core_pdf_compat",
    "core_pdf_spec",
    "core_pdf_validate",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

# impl is flat: a feature's modules share its prefix (capture_, document_ and
# recovery_, extract_, fonts_, graphics_, layout_, output_, render_), and shared
# code lives in the unprefixed modules. tests/src/core_pdf/test_impl_root_contracts.py
# keeps these lists complete, so a new module cannot escape the contracts.
[[tool.importlinter.contracts]]
name = "Shared impl modules never import a feature module"
type = "forbidden"
source_modules = [
    "core_pdf.impl.array_views",
    "core_pdf.impl.exceptions",
    "core_pdf.impl.execution",
    "core_pdf.impl.geometry",
    "core_pdf.impl.glyphs",
    "core_pdf.impl.page_selection",
    "core_pdf.impl.pdf_names",
    "core_pdf.impl.pdf_values",
    "core_pdf.impl.runs",
    "core_pdf.impl.scalars",
    "core_pdf.impl.text",
    "core_pdf.impl.types",
]
forbidden_modules = [
    "core_pdf.impl.document_document",
    "core_pdf.impl.document_fields",
    "core_pdf.impl.document_metadata",
    "core_pdf.impl.document_page",
    "core_pdf.impl.document_page_links",
    "core_pdf.impl.document_page_tree",
    "core_pdf.impl.document_records",
    "core_pdf.impl.document_standards",

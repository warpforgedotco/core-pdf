[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-pdf"
version = "0.0.5"
description = "High-Performance PDF Engine"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "numpy>=2.5.1",
    "tesserocr>=2.10.0",
    "imagecodecs>=2026.6.26",
    "cryptography>=50.0.0",
    "asn1crypto>=1.5.1",
]

[project.scripts]
core-pdf = "core_pdf.cli:main"

[tool.uv]
python-preference = "system"

# [tool.uv.sources]
# nuitka = { path = "../Nuitka", editable = true }

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"
License = "https://github.com/core-experiments/core-pdf/blob/main/LICENSE.txt"
"License documentation" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/README.md"
"Commercial license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-COMMERCIAL.txt"
"Evaluation license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-EVALUATION.txt"
"Philanthropy waiver terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-PHILANTHROPY-WAIVER.txt"

[dependency-groups]
dev = [
    { include-group = "benchmark" },
    { include-group = "lint" },
    { include-group = "test" },
]
benchmark = [
    "liteparse>=2.11.0",
    "llama-cloud>=1.0",
    "pytest-benchmark>=5.1.0,<6.0.0",
    "pytest-codspeed>=5.0.3",
]
lint = [
    "import-linter>=2.13",
    "mypy >=1.16.0, <2.0.0",
    "ruff >=0.11.13, <1.0.0",
    "ty >=0.0.59, <1.0.0",
]
test = [
    "pytest >=8.4.0, <10.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
compiling = [
    "nuitka>=4.1.3",
]
scripts = [
    "textual>=8.2.8",
]
vendor-test = [
    "charset-normalizer>=2.0.0",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "pandas>=2.3.3",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.11.0",
    "pillow>=12.2.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "pypdfium2>=5.9.0",
    "unstructured[pdf]>=0.25.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["."]
markers = [
    "benchmark_high_impact: benchmarks run routinely in pull-request performance CI",
    "compat_differential: compares supported facades against reference libraries",
]

[tool.coverage.run]
source = ["src/core_pdf"]
parallel = true
# The pymupdf facade is quarantined (see api/compat/_unsupported) and nothing
# imports it, so it can only ever measure 0%. Keeping it in `source` weighed the
# ratchet below down by a constant that has nothing to do with live code.
omit = ["src/core_pdf/api/compat/_unsupported/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A ratchet, not a target. Set just below the measured figure so coverage cannot
# silently regress; raise it as gaps close. The rendering package is at 73% now
# that the rasterizer is decomposed, up from 52% when its internals were unreachable.
# Vendored fontTools (src/core_pdf/_vendor) is included in `source` above and no
# longer omitted, so this ratchet was recalibrated after pruning ~57k lines of
# unreachable vendored code (confirmed 0% across the full test suite AND a
# 2377-document real-world PDF corpus): 77 -> 64.
# Raised 64 -> 66 after omitting the quarantined pymupdf facade (which nothing
# imports, so it could only ever read 0%) and deleting ~1.5k lines of dead code;
# measured 66.98%.
# Raised 66 -> 67 after removing the unreachable text-only dispatch table, the
# hand-unrolled float operand paths and several duplicated helpers; measured 67.84%.
fail_under = 67
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@typing.overload",
    "@overload",
]

[tool.ruff]
extend-exclude = [
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/core_pdf/__main__.py" = ["E501"]
# C901 exemptions. Each of these files holds a function above the complexity gate
# that is either a deliberate optimization pinned by docs/architecture.md or known
# debt. Shrink this list rather than raising max-complexity.
#   operations.py  dispatch_operations (162) — protected: hand-unrolled dispatch loop
#   pipeline.py    internal_recognize_page_with_reserved_raster (64)
"src/core_pdf/impl/spec/s_07_content/operations.py" = ["C901"]
"src/core_pdf/impl/extract/ocr/pipeline.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 60

[tool.ruff.lint]
select = [
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "C90",     # mccabe complexity
    "COM",     # flake8-commas
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort (imports)
    "PLR0402", # Name compared with itself like `foo == foo`
    "PT",      # flake8-pytest-style
    "SIM",     # flake8-simplify
    "UP015",   # redundant `open()` mode parameter (like "r" is default)
    "UP018",   # Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal)
    "UP032",   # Use f-string instead of `.format()` call
    "UP034",   # Avoid extraneous parentheses
]

ignore = [
    # Loop/unpack variables the codebase deliberately names `ignored*` or
    # `internal_*` rather than `_`; the rules cannot see that convention.
    "B007",   # unused loop control variable
    # The one getattr() flagged reads an attribute that the vendored fontTools
    # DirectoryEntry does not declare; `ty` rejects direct attribute access there.
    "B009",   # getattr with a constant attribute value
    # Every zip() flagged here is either preceded by an explicit length check or
    # is an intentional pairwise zip(xs, xs[1:]); strict=True would be wrong.
    "B905",   # zip() without an explicit strict=
    "COM812", # over aggressively insists on trailing commas where not desirable
    "PT001",  # use @pytest.fixture() over @pytest.fixture
    "PT011",  # pytest.raises({exc}) too broad, use match param or more specific exception
    "PT012",  # pytest.raises() block should contain a single simple statement
    "PT023",  # use @pytest.mark.asyncio() over @pytest.mark.asyncio
    "SIM108", # ignore encouraging use of ternary operator
    "SIM117", # merge `with` statements for context managers that have same scope
]

[tool.mypy]
python_version = "3.13"
files = ["src/core_pdf"]
mypy_path = "src"
exclude = ["src/core_pdf/_vendor/fontTools"]
show_error_codes = true
ignore_missing_imports = true
# Enabled incrementally. Remaining candidates and their current cost:
# check_untyped_defs (1), disallow_any_generics (9), no_implicit_reexport (9),
# strict_equality (10), warn_unreachable (33), warn_return_any (59).
#
# `warn_redundant_casts` is deliberately NOT enabled: `ty` also runs in this
# project's lint gate and needs several casts that mypy considers redundant, so
# the two checkers give contradictory advice on the same lines.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = [
    "src/core_pdf/api/compat/_unsupported",
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf = ["py.typed"]
"core_pdf._vendor.fontTools" = ["LICENSE.txt", "LICENSE.external.txt"]
"core_pdf._vendor.icc" = ["*.icc", "README.md"]
"core_pdf._vendor.fontTools.ttLib.tables" = ["table_API_readme.txt"]
"core_pdf.impl.layout.data.wordlists" = [
    "*.txt.gz",
    "*.bin",
    "*.md",
    "LICENSE*",
]
"core_pdf.impl.spec.s_09_fonts" = [
    "data/cmaps/**",
    "data/raster_fonts/**",
]

[tool.importlinter]
root_package = "core_pdf"
# The documented invariant is that there are no *runtime* import cycles between
# packages; annotation-only imports are excluded so the tool checks that, and not a
# stricter rule this codebase has never held. See "Dependency direction" in
# docs/architecture.md for the deliberate annotation-only knots.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Derived-processing spine"
type = "layers"
containers = ["core_pdf.impl"]
layers = [
    "document",
    "extract",
    "render",
    "output",
    "model",
]

[[tool.importlinter.contracts]]
name = "Spec layers"
type = "layers"
containers = ["core_pdf.impl.spec"]
# Chapter numbers are not a layering: four s_07_* packages sit at four different
# levels. This is the real order. Colons mark packages that genuinely do not depend
# on one another, so the contract does not invent an ordering between them.
layers = [
    "s_07_document",
    "s_14_structure",
    "s_07_content",
    "s_09_fonts : s_08_graphics : s_07_security",
    "s_07_syntax",
    "s_07_filters",
    "s_07_syntax_primitives",
]

[[tool.importlinter.contracts]]
name = "Spec stays below derived consumers"
type = "forbidden"
source_modules = ["core_pdf.impl.spec"]
forbidden_modules = [
    "core_pdf.impl.document",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
]

[[tool.importlinter.contracts]]
name = "impl/runtime is the floor"
type = "forbidden"
source_modules = ["core_pdf.impl.runtime"]
forbidden_modules = [
    "core_pdf.impl.document",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.model",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
    "core_pdf.impl.spec",
    "core_pdf.api",
]

[[tool.importlinter.contracts]]
name = "The capture model depends on nothing above it"
type = "forbidden"
source_modules = ["core_pdf.impl.model"]
forbidden_modules = [
    "core_pdf.impl.document",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
    "core_pdf.impl.spec",
    "core_pdf.api",
]

[[tool.importlinter.contracts]]
name = "The COS layer depends only on filters, syntax primitives, and base modules"
type = "forbidden"
source_modules = ["core_pdf.impl.spec.s_07_syntax"]
forbidden_modules = [
    "core_pdf.impl.spec.s_07_content",
    "core_pdf.impl.spec.s_07_document",
    "core_pdf.impl.spec.s_07_security",
    "core_pdf.impl.spec.s_08_graphics",
    "core_pdf.impl.spec.s_09_fonts",
    "core_pdf.impl.spec.s_14_structure",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.model",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
]

[[tool.importlinter.contracts]]
name = "Syntax primitives are the spec floor"
type = "forbidden"
source_modules = ["core_pdf.impl.spec.s_07_syntax_primitives"]
forbidden_modules = [
    "core_pdf.impl.spec.s_07_content",
    "core_pdf.impl.spec.s_07_document",
    "core_pdf.impl.spec.s_07_filters",
    "core_pdf.impl.spec.s_07_security",
    "core_pdf.impl.spec.s_07_syntax",
    "core_pdf.impl.spec.s_08_graphics",
    "core_pdf.impl.spec.s_09_fonts",
    "core_pdf.impl.spec.s_14_structure",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.model",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
]

[[tool.importlinter.contracts]]
name = "The implementation never imports the compatibility facades"
type = "forbidden"
source_modules = ["core_pdf.impl"]
forbidden_modules = ["core_pdf.api"]

[[tool.importlinter.contracts]]
name = "Base modules stay beneath the spec and derived processing"
type = "forbidden"
source_modules = [
    "core_pdf.impl.exceptions",
    "core_pdf.impl.pages",
    "core_pdf.impl.primitives",
    "core_pdf.impl.records",
    "core_pdf.impl.text",
    "core_pdf.impl.types",
]
forbidden_modules = [
    "core_pdf.impl.document",
    "core_pdf.impl.extract",
    "core_pdf.impl.layout",
    "core_pdf.impl.model",
    "core_pdf.impl.output",
    "core_pdf.impl.render",
    "core_pdf.impl.serialize",
    "core_pdf.impl.spec",
]

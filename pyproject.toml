[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "core-pdf"
version = "0.0.0"
description = "High-performance pure Python PDF parsing engine"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload", "Development Status :: 3 - Alpha"]

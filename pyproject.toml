[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-pdf"
version = "0.0.7"
description = "High-Performance PDF Engine"
authors = [{ name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "numpy>=2.5.1",
    "imagecodecs>=2026.6.26",
    "defusedxml>=0.7.1",
    "core-pdf-spec>=0.5.0,<0.6.0",
    "pillow>=12.2.0",
    "core-predictors>=0.1.0,<0.2.0",
    "core-jbig2>=0.1.0,<0.2.0",
    "core-adobe-fonts>=0.1.0,<0.2.0",
]

[project.scripts]
core-pdf = "core_pdf.cli:main"

[tool.uv]
python-preference = "system"

[tool.uv.workspace]
members = [
    "packages/core-pdf-ocr",
    "packages/core-pdf-spec",
    "packages/core-pdf-validate",
    "packages/core-predictors",
    "packages/core-postscript",
    "packages/core-jbig2",
    "packages/core-pdf-crypto",
    "packages/core-adobe-fonts",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
core-predictors = { workspace = true }
core-jbig2 = { workspace = true }
core-adobe-fonts = { workspace = true }
core-pdf-spec = { workspace = true }

# [tool.uv.sources]
# nuitka = { path = "../Nuitka", editable = true }

[project.urls]
Repository = "https://github.com/core-experiments/core-pdf"
License = "https://github.com/core-experiments/core-pdf/blob/main/LICENSE.txt"
"License documentation" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/README.md"
"Commercial license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-COMMERCIAL.txt"
"Evaluation license terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-EVALUATION.txt"
"Philanthropy waiver terms" = "https://github.com/core-experiments/core-pdf/blob/main/docs/license/LICENSE-PHILANTHROPY-WAIVER.txt"

[project.optional-dependencies]
unstructured = [
    "en-core-web-sm==3.8.0",
    "spacy>=3.8.15,<3.9.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "import-linter>=2.13",
    "mypy >=1.16.0, <2.0.0",
    "ruff >=0.11.13, <1.0.0",
    "ty >=0.0.59, <1.0.0",
]
test = [
    "coverage>=7.16.1",
    "pytest >=8.4.0, <10.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
compiling = [
    "nuitka>=4.1.3",
]
scripts = [
    "textual>=8.2.8",
]
vendor-test = [
    "charset-normalizer>=2.0.0",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "pandas>=2.3.3",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.11.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "pypdfium2>=5.9.0",
    "unstructured[pdf]>=0.25.2",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/src/core_pdf",
    "packages/core-pdf-ocr/tests",
    "packages/core-pdf-spec/tests",
    "packages/core-pdf-validate/tests",
    "packages/core-predictors/tests",
    "packages/core-postscript/tests",
    "packages/core-jbig2/tests",
    "packages/core-pdf-crypto/tests",
    "packages/core-adobe-fonts/tests",
]
addopts = "--import-mode=importlib"
norecursedirs = ["tests/fixtures"]
pythonpath = ["."]
markers = [
    "compat_differential: compares supported facades against reference libraries",
]

[tool.coverage.run]
branch = true
source = [
    "src/core_pdf",
    "packages/core-pdf-ocr/src/core_pdf_ocr",
    "packages/core-pdf-spec/src/core_pdf_spec",
    "packages/core-pdf-validate/src/core_pdf_validate",
    "packages/core-predictors/src/core_predictors",
    "packages/core-postscript/src/core_postscript",
    "packages/core-jbig2/src/core_jbig2",
    "packages/core-pdf-crypto/src/core_pdf_crypto",
    "packages/core-adobe-fonts/src/core_adobe_fonts",
]
omit = ["*/_vendor/*"]
relative_files = true

[tool.coverage.report]
precision = 2

[tool.coverage.json]
output = "htmlcov/coverage.json"

[tool.ruff]
src = ["src", "packages/core-pdf-ocr/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-predictors/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src", "."]
extend-exclude = [
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/core_pdf/__main__.py" = ["E501"]
[tool.ruff.lint.mccabe]
max-complexity = 60

[tool.ruff.lint]
select = [
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "C90",     # mccabe complexity
    "COM",     # flake8-commas
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "FURB",    # refurb modernisations
    "I",       # isort (imports)
    "PERF",    # perflint
    "PIE",     # flake8-pie
    "PLR1714", # repeated equality comparison
    "PLR5501", # collapsible else-if
    "PLR0402", # Name compared with itself like `foo == foo`
    "PT",      # flake8-pytest-style
    "RET504",  # unnecessary assignment before return
    "RET505",  # superfluous else after return
    "SIM",     # flake8-simplify
    "UP035",   # deprecated typing imports
    "UP037",   # quoted annotations under future annotations
    "UP046",   # PEP 695 generic classes
    "UP047",   # PEP 695 generic functions
    "UP015",   # redundant `open()` mode parameter (like "r" is default)
    "UP018",   # Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal)
    "UP032",   # Use f-string instead of `.format()` call
    "UP034",   # Avoid extraneous parentheses
]

ignore = [
    # Loop/unpack variables the codebase deliberately names `ignored*` or
    # `internal_*` rather than `_`; the rules cannot see that convention.
    "B007",   # unused loop control variable
    # The one getattr() flagged reads an attribute that the vendored fontTools
    # DirectoryEntry does not declare; `ty` rejects direct attribute access there.
    "B009",   # getattr with a constant attribute value
    # Every zip() flagged here is either preceded by an explicit length check or
    # is an intentional pairwise zip(xs, xs[1:]); strict=True would be wrong.
    "B905",   # zip() without an explicit strict=
    "COM812", # over aggressively insists on trailing commas where not desirable
    "PT001",  # use @pytest.fixture() over @pytest.fixture
    "PT011",  # pytest.raises({exc}) too broad, use match param or more specific exception
    "PT012",  # pytest.raises() block should contain a single simple statement
    "PT023",  # use @pytest.mark.asyncio() over @pytest.mark.asyncio
    "SIM108", # ignore encouraging use of ternary operator
    "SIM117", # merge `with` statements for context managers that have same scope
]

[tool.mypy]
python_version = "3.14"
files = ["src/core_pdf", "packages/core-pdf-ocr/src/core_pdf_ocr", "packages/core-pdf-spec/src/core_pdf_spec", "packages/core-pdf-validate/src/core_pdf_validate", "packages/core-predictors/src/core_predictors", "packages/core-postscript/src/core_postscript", "packages/core-jbig2/src/core_jbig2", "packages/core-pdf-crypto/src/core_pdf_crypto", "packages/core-adobe-fonts/src/core_adobe_fonts"]
mypy_path = ["src", "packages/core-pdf-ocr/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-predictors/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src"]
exclude = ["src/core_pdf/_vendor/fontTools"]
show_error_codes = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ty.environment]
root = [".", "src", "packages/core-pdf-ocr/src", "packages/core-pdf-spec/src", "packages/core-pdf-validate/src", "packages/core-predictors/src", "packages/core-postscript/src", "packages/core-jbig2/src", "packages/core-pdf-crypto/src", "packages/core-adobe-fonts/src"]

[tool.ty.src]
exclude = [
    "src/core_pdf/_vendor/fontTools",
    "tests/fixtures",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core_pdf = ["py.typed"]
"core_pdf._vendor.fontTools" = ["LICENSE.txt", "LICENSE.external.txt"]
"core_pdf._vendor.icc" = ["*.icc", "README.md"]
"core_pdf._vendor.fontTools.ttLib.tables" = ["table_API_readme.txt"]
"core_pdf.impl._impl.layout.data.wordlists" = [
    "*.txt.gz",
    "*.bin",
    "*.md",
    "LICENSE*",
]
"core_pdf.impl._impl.fonts" = ["data/raster_fonts/**"]

[tool.importlinter]
root_packages = [
    "core_pdf",
    "core_pdf_ocr",
    "core_pdf_spec",
    "core_pdf_validate",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Core never depends on OCR"
type = "forbidden"
source_modules = ["core_pdf"]
forbidden_modules = ["core_pdf_ocr"]

[[tool.importlinter.contracts]]
name = "Validation is an opt-in companion"
type = "forbidden"
source_modules = ["core_pdf", "core_pdf_spec", "core_pdf_ocr"]
forbidden_modules = ["core_pdf_validate"]

[[tool.importlinter.contracts]]
name = "Validation uses only public core interfaces"
type = "forbidden"
source_modules = ["core_pdf_validate"]
forbidden_modules = ["core_pdf.impl", "core_pdf_ocr"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Standards records stay below chapter algorithms"
type = "forbidden"
source_modules = ["core_pdf_spec.standards"]
forbidden_modules = [
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

[[tool.importlinter.contracts]]
name = "OCR implementation stays below public APIs"
type = "forbidden"
source_modules = ["core_pdf_ocr.impl"]
forbidden_modules = ["core_pdf.api", "core_pdf_ocr.api"]

[[tool.importlinter.contracts]]
name = "Derived-processing spine"
type = "layers"
containers = ["core_pdf.impl._impl"]
layers = [
    "extract",
    "render",
    "output : layout",
    "model",
]

[[tool.importlinter.contracts]]
name = "Serialization stays below processing and the specification"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.output.serialize"]
ignore_imports = ["core_pdf.impl._impl.model.geometry -> core_pdf_spec.s_08_graphics.geometry"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.render",
    "core_pdf.impl._impl.runtime",
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_pdf.api",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]



[[tool.importlinter.contracts]]
name = "Spec never depends on core or OCR"
type = "forbidden"
source_modules = ["core_pdf_spec"]
forbidden_modules = ["core_pdf", "core_pdf_ocr"]

# Each standards package implements one external standard (T.88, PNG/TIFF
# predictors, PLRM calculator, CMS/PDF MAC ciphers, Adobe font formats) and is
# the workspace floor: PDF glue stays in the spec chapter that cites it.
[[tool.importlinter.contracts]]
name = "Standards packages are the workspace floor"
type = "forbidden"
source_modules = [
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]
forbidden_modules = ["core_pdf", "core_pdf_ocr", "core_pdf_spec", "core_pdf_validate"]

# core-predictors also hosts the shared numpy sample-view helpers, so it is the
# one floor package the others may use; the rest stay independent of each other.
[[tool.importlinter.contracts]]
name = "Standards packages depend at most on core-predictors"
type = "layers"
layers = [
    "core_postscript | core_jbig2 | core_pdf_crypto | core_adobe_fonts",
    "core_predictors",
]

[[tool.importlinter.contracts]]
name = "impl/_impl/runtime is the floor"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.runtime"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.model",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.render",
    "core_pdf_spec",
    "core_pdf.api",
]

[[tool.importlinter.contracts]]
name = "The shared model depends on nothing above it"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.model"]
# Spec's geometry module is a leaf (only core_pdf_spec.types); the model
# re-exports its bbox helpers rather than duplicating them.
ignore_imports = ["core_pdf.impl._impl.model.geometry -> core_pdf_spec.s_08_graphics.geometry"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.render",
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_pdf.api",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

[[tool.importlinter.contracts]]
name = "The COS layer depends only on filters, syntax primitives, and base modules"
type = "forbidden"
source_modules = ["core_pdf_spec.s_07_syntax"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.model",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.render",
    # Predictors and JBIG2 are reached through s_07_filters by design.
    "core_postscript",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

[[tool.importlinter.contracts]]
name = "Syntax primitives are the spec floor"
type = "forbidden"
source_modules = ["core_pdf_spec.s_07_syntax_primitives"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.model",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.render",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

[[tool.importlinter.contracts]]
name = "The implementation never imports the public API"
type = "forbidden"
source_modules = ["core_pdf.impl"]
forbidden_modules = ["core_pdf.api"]

[[tool.importlinter.contracts]]
name = "Base modules stay beneath the spec and derived processing"
type = "forbidden"
source_modules = [
    "core_pdf.impl.exceptions",
    "core_pdf.impl.types",
]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.graphics",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.layout",
    "core_pdf.impl._impl.model",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.render",
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]


[[tool.importlinter.contracts]]
name = "Font and graphics adapters stay below capture and document composition"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.fonts", "core_pdf.impl._impl.graphics"]
forbidden_modules = [
    "core_pdf.impl._impl.document",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.render",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.layout",
]

[[tool.importlinter.contracts]]
name = "Capture stays below document composition and output processing"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.capture"]
forbidden_modules = [
    "core_pdf.impl._impl.document.document",
    "core_pdf.impl._impl.document.page",
    "core_pdf.impl._impl.document.fields",
    "core_pdf.impl._impl.document.metadata",
    "core_pdf.impl._impl.document.structure",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.render",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.layout",
]

[[tool.importlinter.contracts]]
name = "Object recovery stays below content capture and document composition"
type = "forbidden"
source_modules = ["core_pdf.impl._impl.document.recovery"]
forbidden_modules = [
    "core_pdf.impl._impl.document.document",
    "core_pdf.impl._impl.document.page",
    "core_pdf.impl._impl.capture",
    "core_pdf.impl._impl.fonts",
    "core_pdf.impl._impl.extract",
    "core_pdf.impl._impl.render",
    "core_pdf.impl._impl.output",
    "core_pdf.impl._impl.layout",
]


[[tool.importlinter.contracts]]
name = "Spec identities stay beneath chapter algorithms"
type = "forbidden"
source_modules = ["core_pdf_spec.types", "core_pdf_spec.exceptions"]
forbidden_modules = [
    "core_pdf_spec.s_07_content",
    "core_pdf_spec.s_07_document",
    "core_pdf_spec.s_07_filters",
    "core_pdf_spec.s_07_security",
    "core_pdf_spec.s_07_syntax",
    "core_pdf_spec.s_07_syntax_primitives",
    "core_pdf_spec.s_08_graphics",
    "core_pdf_spec.s_09_fonts",
    "core_pdf_spec.s_11_transparency",
    "core_pdf_spec.s_14_structure",
    "core_predictors",
    "core_postscript",
    "core_jbig2",
    "core_pdf_crypto",
    "core_adobe_fonts",
]

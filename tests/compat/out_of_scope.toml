# Upstream tests the facades do not aim to pass. Paths are relative to the checkout.
# `names` drops any test whose source mentions one of them. `strategies` drops only the
# test cases that run one: a parameter value equal to it, or the test body naming it, so
# a parametrized test keeps its other cases. `strategy_agnostic` exempts tests from
# `strategies`. Everything else is in scope, so a failure there is a facade gap.
# run_upstream_suite.py applies this list to the real library too, so both runs count
# the same tests.

[pdfplumber]
reason = "pdfium's pixel rounding for a rotated MediaBox, and a no-smoothing render mode"
names = ["force_mediabox", "antialias"]

[pdfminer]
reason = "pdfminer internals, and its byte-exact JBIG2 file wrapper"
names = ["XIPLAYER0"]
files = [
    "tests/test_cmapdb.py",
    "tests/test_cmapdb_security.py",
    "tests/test_converter.py",
    "tests/test_encodingdb.py",
    "tests/test_pdfdocument.py",
    "tests/test_pdfencoding.py",
    "tests/test_pdffont.py",
    "tests/test_pdfminer_ccitt.py",
    "tests/test_pdfminer_psparser.py",
    "tests/test_pdfpage.py",
    "tests/test_tools_conv_cmap_reproducibility.py",
    "tests/test_tools_dumppdf.py",
]

[pypdf]
reason = "imports these unimplemented modules; a test is skipped only if it reaches one"
stubs = [
    "pypdf.generic",
    "pypdf.annotations",
    "pypdf.filters",
    "pypdf.actions",
    "pypdf.xmp",
    "pypdf._font",
    "pypdf._cmap",
    "pypdf._codecs",
    "pypdf._page",
    "pypdf._page_labels",
    "pypdf._protocols",
    "pypdf._reader",
    "pypdf._utils",
    "pypdf._encryption",
    "pypdf._crypt_providers",
    "pypdf._text_extraction",
]
files = ["tests/scripts/test_make_release.py"]
markers = "not enable_socket"

[xray]
reason = "these helpers take PyMuPDF pages; xray.inspect is the public API"
names = ["get_good_rectangles", "get_bad_redactions", "get_intersecting_chars"]

[unstructured]
reason = "OCR, inference and pdfminer-internal helpers rather than partition_pdf; hi_res and OCR need inference models the facade has none of, and tests that patch internals"
strategies = ["hi_res", "ocr_only"]
strategy_agnostic = [
    # languages is validated before a strategy runs, so the TypeError needs no model.
    "test_partition_pdf_raises_TypeError_for_invalid_languages",
]
names = [
    "mock_process_file_with_model",
    "chunking_strategy", "PDF_CHAR_DUPLICATE_THRESHOLD",
    "extractable_elements", "document_to_element_list", "_partition_pdf_or_image_local", "partition_pdf_or_image",
    "check_annotations_within_element", "default_hi_res_model", "_rotation_corrections_from_layout", "is_pdf_too_complex",
    # Imported from unstructured itself, so these pass without touching the facade.
    "get_uris_from_annots",
    # extract_image_block_types makes auto resolve to hi_res on the real library.
    "test_partition_pdf_element_extraction",
]
files = [
    "test_unstructured/partition/pdf_image/test_analysis.py",
    "test_unstructured/partition/pdf_image/test_image.py",
    "test_unstructured/partition/pdf_image/test_inference_utils.py",
    "test_unstructured/partition/pdf_image/test_merge_elements.py",
    "test_unstructured/partition/pdf_image/test_ocr.py",
    "test_unstructured/partition/pdf_image/test_pdf_image_utils.py",
    "test_unstructured/partition/pdf_image/test_pdfminer_processing.py",
    "test_unstructured/partition/pdf_image/test_pdfminer_utils.py",
]

[llamaindex]
reason = "non-PDF readers"
files = [
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_docs.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_html_reader.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_image_vision_llm.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_markdown.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_readers_file.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_rtf.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_slides.py",
    "llama-index-integrations/readers/llama-index-readers-file/tests/test_xml.py",
]

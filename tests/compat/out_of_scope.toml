# Upstream tests the facades do not aim to pass. Paths are relative to the checkout.
# `names` drops any test whose source mentions one of them, and `deselect` drops exact
# pytest node ids. Everything else is in scope, so a failure there is a facade gap.
# run_upstream_suite.py applies this list to the real library too, so both runs count
# the same tests.

[pdfplumber]
reason = "pdfium's pixel rounding for a rotated MediaBox, and a no-smoothing render mode"
names = ["force_mediabox", "antialias"]

[pdfminer]
reason = "pdfminer internals, and its byte-exact JBIG2 file wrapper"
names = ["XIPLAYER0"]
files = [
    "tests/test_cmapdb.py",
    "tests/test_cmapdb_security.py",
    "tests/test_converter.py",
    "tests/test_encodingdb.py",
    "tests/test_pdfdocument.py",
    "tests/test_pdfencoding.py",
    "tests/test_pdffont.py",
    "tests/test_pdfminer_ccitt.py",
    "tests/test_pdfminer_psparser.py",
    "tests/test_pdfpage.py",
    "tests/test_tools_conv_cmap_reproducibility.py",
    "tests/test_tools_dumppdf.py",
]

[pypdf]
reason = "imports these unimplemented modules; a test is skipped only if it reaches one. Tests of pypdf internals are out of scope; the public API stays in scope however hard it is to implement"
# Private to pypdf: a leading underscore, a member of a private module, or reader
# caches such as resolved_objects. A test using one is out of scope even if the rest of
# it is public. Public attributes like trailer, root_object and get_object stay in scope.
names = [
    # PdfReader internals
    "_find_pdf_objects", "_find_pdf_trailers", "_find_previous_startxref_pos", "_get_indirect_object",
    "_get_page_number_by_indirect", "resolved_objects", "xref_objStm", "_encryption",
    # PdfDocCommon internals
    "_get_named_destinations", "_list_attachments",
    # PageObject internals
    "_content_stream_images", "_get_fonts", "_get_image",
    # generic and font internals
    "_read_unsized_from_stream", "_get_typographic_maps",
    # Private modules. A subprocess script or pytest.warns block hides a stub from the
    # skip hook, and extract_inline_default does arithmetic on a stubbed constant.
    "_appearance_stream", "_font", "_utils", "deprecate_with_replacement", "extract_inline_default",
]
# With pypdf._crypt_providers stubbed, HAS_AES is false, so these take a branch that
# expects DependencyError and compares it to a private constant. The real library never
# takes it here, and a facade that decrypts AES cannot pass it. The non-AES parameters
# of this test stay in scope, so `names` cannot express this.
deselect = [
    "tests/test_encryption.py::test_encryption[r4-aes-user-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r5-empty-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r5-user-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r5-owner-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r6-empty-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r6-user-password.pdf-True]",
    "tests/test_encryption.py::test_encryption[r6-owner-password.pdf-True]",
]
stubs = [
    "pypdf.generic",
    "pypdf.annotations",
    "pypdf.filters",
    "pypdf.actions",
    "pypdf.xmp",
    "pypdf._font",
    "pypdf._cmap",
    "pypdf._codecs",
    "pypdf._page",
    "pypdf._page_labels",
    "pypdf._protocols",
    "pypdf._reader",
    "pypdf._utils",
    "pypdf._encryption",
    "pypdf._crypt_providers",
    "pypdf._text_extraction",
]
files = ["tests/scripts/test_make_release.py"]
markers = "not enable_socket"
# These also touch a private name, but they are the only tests of public features the
# facade lacks: viewer_preferences, attachment_list and named_destinations.
keep = [
    "test_viewer_preferences__indirect_reference",
    "test_attachments",
    "test_named_destinations_cache",
]

[xray]
reason = "these helpers take PyMuPDF pages; xray.inspect is the public API"
names = ["get_good_rectangles", "get_bad_redactions", "get_intersecting_chars"]

[unstructured]
reason = "OCR, inference and pdfminer-internal helpers rather than partition_pdf; hi_res and OCR need inference models the facade has none of, and tests that patch internals"
